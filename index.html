    <!-- Script de lógica de la aplicación -->
    <script>
        // Fecha actual
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-CO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // Estado inicial de la base de datos local
        let db = JSON.parse(localStorage.getItem('gdl_rentas_db')) || {
            boxes: [
                { id: 'BOX-001', impuesto: 'Impuesto de Vehículos Automotores', remite: 'Yohana Estrada', fecha: '2026-10-15', estado: 'Pendiente', obs: 'Caja con liquidaciones trimestre 3', foto: 'https://images.unsplash.com/photo-1544717305-2782549b5136?w=100&auto=format&fit=crop&q=80' },
                { id: 'BOX-002', impuesto: 'Impuesto de Registro', remite: 'Diana Osorio', fecha: '2026-10-18', estado: 'Procesada', obs: 'Trámites de pasaportes y exenciones', foto: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=80' }
            ],
            expedientes: [
                {
                    id: 'EXP-0519',
                    codigo: 'Exp. 0519',
                    nombre: 'WILSON MILLAN PARRA',
                    trd: '1.120.80.20 - 65.04 | Procesos Administrativos de Devolución',
                    estado: 'Abierto', // Abierto, Cerrado, Trasladado
                    ubicacion: { dep: 'Depósito 1 (Edificio Gobernación)', caja: 1, modulo: 'A-1', estante: '02', carpeta: 1 },
                    items: [
                        { item: 1, fdocInc: '2025-07-15', fdoc: '2025-07-15', desc: 'SOLICITUD RADICADO 2025029340', folios: '1-4', func: 'YOHANA ESTRADA', obs: 'Ninguna' },
                        { item: 2, fdocInc: '2025-07-30', fdoc: '2025-07-30', desc: 'CERTIFICACION DE INGRESO - 2025032191', folios: '5-6', func: 'YOHANA ESTRADA', obs: 'Ok' }
                    ]
                }
            ]
        };

        function saveDB() {
            localStorage.setItem('gdl_rentas_db', JSON.stringify(db));
            renderAll();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-green-600', 'text-green-700');
                el.classList.add('border-transparent', 'text-slate-600');
            });
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.remove('border-transparent', 'text-slate-600');
            activeBtn.classList.add('border-green-600', 'text-green-700');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function openNewBoxModal() { openModal('modal-box'); }
        function openNewExpedienteModal() { openModal('modal-exp'); }
        function openAddItemModal() {
            const expId = document.getElementById('select-expediente').value;
            if(!expId) { alert('Por favor seleccione un expediente primero.'); return; }
            openModal('modal-item');
        }

        // Guardar nueva caja en Bandeja de Entrada
        function saveNewBox() {
            const impuesto = document.getElementById('box-impuesto').value;
            const remite = document.getElementById('box-remite').value || 'Colaborador';
            const obs = document.getElementById('box-obs').value;
            const fileInput = document.getElementById('box-foto');
            
            let fotoUrl = 'https://images.unsplash.com/photo-1586075010923-2dd4570fb338?w=100&auto=format&fit=crop&q=80';
            if(fileInput.files && fileInput.files[0]) {
                fotoUrl = URL.createObjectURL(fileInput.files[0]);
            }

            const newBox = {
                id: 'BOX-' + String(db.boxes.length + 1).padStart(3, '0'),
                impuesto,
                remite,
                fecha: new Date().toISOString().split('T')[0],
                estado: 'Pendiente',
                obs,
                foto: fotoUrl
            };

            db.boxes.unshift(newBox);
            saveDB();
            closeModal('modal-box');
        }

        // Guardar nuevo expediente
        function saveNewExpediente() {
            const codigo = document.getElementById('exp-codigo').value;
            const nombre = document.getElementById('exp-nombre').value;
            const trd = document.getElementById('exp-trd').value;

            if(!codigo || !nombre) { alert('Complete los campos obligatorios.'); return; }

            const newExp = {
                id: codigo,
                codigo,
                nombre,
                trd,
                estado: 'Abierto',
                ubicacion: { dep: 'Pendiente', caja: 0, modulo: '-', estante: '-', carpeta: 1 },
                items: []
            };

            db.expedientes.push(newExp);
            saveDB();
            closeModal('modal-exp');
            document.getElementById('select-expediente').value = codigo;
            loadExpedienteDetails();
        }

        // Cargar detalles de expediente en Hoja de Control
        function loadExpedienteDetails() {
            const expId = document.getElementById('select-expediente').value;
            const container = document.getElementById('expediente-container');
            if(!expId) {
                container.classList.add('hidden');
                return;
            }

            const exp = db.expedientes.find(e => e.id === expId);
            if(!exp) return;

            container.classList.remove('hidden');
            document.getElementById('title-current-exp').innerText = `${exp.codigo} - ${exp.nombre}`;
            document.getElementById('meta-trd').innerHTML = `<strong class="text-slate-800">TRD Asignada:</strong> ${exp.trd}`;

            let tbody = document.getElementById('items-table-body');
            tbody.innerHTML = '';
            if(exp.items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400">No hay documentos incorporados todavía en este expediente.</td></tr>`;
                return;
            }

            exp.items.forEach((it, idx) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2.5 border-b font-bold">${idx + 1}</td>
                        <td class="p-2.5 border-b">${it.fdocInc}</td>
                        <td class="p-2.5 border-b">${it.fdoc}</td>
                        <td class="p-2.5 border-b font-medium">${it.desc}</td>
                        <td class="p-2.5 border-b">${it.folios}</td>
                        <td class="p-2.5 border-b">${it.func}</td>
                        <td class="p-2.5 border-b text-slate-500">${it.obs}</td>
                        <td class="p-2.5 border-b text-center">
                            <button onclick="deleteItem('${exp.id}', ${idx})" class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // Añadir ítem al expediente
        function saveItemToExpediente() {
            const expId = document.getElementById('select-expediente').value;
            const fdoc = document.getElementById('item-fdoc').value || new Date().toISOString().split('T')[0];
            const desc = document.getElementById('item-desc').value;
            const folios = document.getElementById('item-folios').value || '1';
            const func = document.getElementById('item-func').value;
            const obs = document.getElementById('item-obs').value || 'Ninguna';

            if(!desc) { alert('Ingrese la descripción del documento.'); return; }

            const exp = db.expedientes.find(e => e.id === expId);
            if(exp) {
                exp.items.push({
                    item: exp.items.length + 1,
                    fdocInc: new Date().toISOString().split('T')[0],
                    fdoc,
                    desc,
                    folios,
                    func,
                    obs
                });
                saveDB();
                closeModal('modal-item');
                loadExpedienteDetails();
            }
        }

        function deleteItem(expId, idx) {
            const exp = db.expedientes.find(e => e.id === expId);
            if(exp) {
                exp.items.splice(idx, 1);
                saveDB();
                loadExpedienteDetails();
            }
        }

        function closeExpedienteToOutbox() {
            const expId = document.getElementById('select-expediente').value;
            if(!expId) return;
            const exp = db.expedientes.find(e => e.id === expId);
            if(exp) {
                exp.estado = 'Cerrado';
                saveDB();
                alert('Expediente cerrado y enviado a la Bandeja de Salida para asignación de ubicación.');
                switchTab('outbox');
            }
        }

        // Abrir modal de ubicación
        function openUbicacionModal(expId) {
            document.getElementById('ubicacion-exp-id').value = expId;
            openModal('modal-ubicacion');
        }

        function saveUbicacion() {
            const expId = document.getElementById('ubicacion-exp-id').value;
            const dep = document.getElementById('ub-dep').value;
            const caja = parseInt(document.getElementById('ub-caja').value) || 1;
            const modulo = document.getElementById('ub-modulo').value;
            const estante = document.getElementById('ub-estante').value;
            const carpeta = document.getElementById('ub-carpeta').value;

            const exp = db.expedientes.find(e => e.id === expId);
            if(exp) {
                exp.ubicacion = { dep, caja, modulo, estante, carpeta };
                exp.estado = 'Archivado';
                saveDB();
                closeModal('modal-ubicacion');
            }
        }

        // Renderizar todas las vistas
        function renderAll() {
            // Actualizar select de expedientes
            const sel = document.getElementById('select-expediente');
            const currentVal = sel.value;
            sel.innerHTML = '<option value="">-- Seleccione un expediente --</option>';
            db.expedientes.forEach(e => {
                sel.innerHTML += `<option value="${e.id}">${e.codigo} - ${e.nombre} (${e.estado})</option>`;
            });
            sel.value = currentVal;

            // Estadísticas
            let pendingBoxes = db.boxes.filter(b => b.estado === 'Pendiente').length;
            let processedBoxes = db.boxes.filter(b => b.estado === 'Procesada').length;
            document.getElementById('stat-pending').innerText = pendingBoxes;
            document.getElementById('stat-processed').innerText = processedBoxes;
            document.getElementById('stat-total-boxes').innerText = db.boxes.length;
            document.getElementById('badge-inbox').innerText = pendingBoxes;
            document.getElementById('badge-outbox').innerText = db.expedientes.filter(e => e.estado === 'Cerrado' || e.estado === 'Archivado').length;

            // Tabla Inbox
            let inboxBody = document.getElementById('inbox-table-body');
            inboxBody.innerHTML = '';
            db.boxes.forEach(b => {
                inboxBody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3"><img src="${b.foto}" class="w-10 h-10 object-cover rounded-lg border shadow-sm"></td>
                        <td class="p-3 font-bold text-slate-700">${b.id}</td>
                        <td class="p-3 font-semibold text-green-700">${b.impuesto}</td>
                        <td class="p-3 text-slate-600">${b.remite}</td>
                        <td class="p-3 text-slate-500 text-xs">${b.fecha}</td>
                        <td class="p-3">
                            <span class="px-2.5 py-1 text-xs font-bold rounded-full ${b.estado === 'Pendiente' ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800'}">${b.estado}</span>
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="toggleBoxStatus('${b.id}')" class="text-xs bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg">
                                ${b.estado === 'Pendiente' ? 'Marcar Procesada' : 'Reabrir'}
                            </button>
                        </td>
                    </tr>
                `;
            });

            // Tabla Outbox
            let outboxBody = document.getElementById('outbox-table-body');
            outboxBody.innerHTML = '';
            db.expedientes.forEach(e => {
                outboxBody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-bold text-slate-800">${e.codigo}<br><span class="font-normal text-slate-500">${e.nombre}</span></td>
                        <td class="p-3 text-xs text-slate-600">${e.trd}</td>
                        <td class="p-3 font-semibold">${e.items.length > 0 ? e.items[e.items.length-1].folios : '0'}</td>
                        <td class="p-3 text-xs">
                            <strong class="text-slate-700">${e.ubicacion.dep}</strong><br>
                            Caja: ${e.ubicacion.caja} | Mód: ${e.ubicacion.modulo} | Carpeta: ${e.ubicacion.carpeta}
                        </td>
                        <td class="p-3">
                            <span class="px-2.5 py-1 text-xs font-bold rounded-full ${e.estado === 'Archivado' ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}">${e.estado}</span>
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="openUbicacionModal('${e.id}')" class="text-xs bg-green-700 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg shadow">
                                <i class="fa-solid fa-map-pin mr-1"></i> Ubicación
                            </button>
                        </td>
                    </tr>
                `;
            });

            // Tabla FUID Oficial (FO-M9-P3-06)
            let fuidBody = document.getElementById('fuid-table-body');
            fuidBody.innerHTML = '';
            db.expedientes.forEach((e, idx) => {
                let trdCode = e.trd.split('|')[0].trim();
                let trdName = e.trd.split('|')[1] || e.trd;
                let fechaIni = e.items.length > 0 ? e.items[0].fdoc : '2026-01-01';
                let fechaFin = e.items.length > 0 ? e.items[e.items.length-1].fdoc : '2026-10-30';
                let nFolios = e.items.length > 0 ? e.items[e.items.length-1].folios : '1';

                fuidBody.innerHTML += `
                    <tr class="text-center text-[11px] hover:bg-slate-50">
                        <td class="p-2 border border-slate-300 font-bold">${idx + 1}</td>
                        <td class="p-2 border border-slate-300 font-mono text-[10px]">${trdCode}</td>
                        <td class="p-2 border border-slate-300 text-left">${trdName}</td>
                        <td class="p-2 border border-slate-300 text-left font-semibold">${e.codigo} - ${e.nombre}</td>
                        <td class="p-2 border border-slate-300">${fechaIni}</td>
                        <td class="p-2 border border-slate-300">${fechaFin}</td>
                        <td class="p-2 border border-slate-300">${e.ubicacion.caja || 1}</td>
                        <td class="p-2 border border-slate-300">${e.ubicacion.carpeta || 1}</td>
                        <td class="p-2 border border-slate-300 font-bold">${nFolios}</td>
                        <td class="p-2 border border-slate-300 text-xs">${e.ubicacion.dep}</td>
                    </tr>
                `;
            });
        }

        function toggleBoxStatus(id) {
            const box = db.boxes.find(b => b.id === id);
            if(box) {
                box.estado = box.estado === 'Pendiente' ? 'Procesada' : 'Pendiente';
                saveDB();
            }
        }

        // Exportar FUID a Excel usando SheetJS
        function exportFUIDExcel() {
            let wb = XLSX.utils.book_new();
            let wsData = [
                ["GOBERNACIÓN DEL VALLE DEL CAUCA"],
                ["FORMATO ÚNICO DE INVENTARIO DOCUMENTAL (FUID)"],
                ["OFICINA PRODUCTORA:", "Subgerencia de Liquidación y Devoluciones"],
                [],
                ["N° Orden", "Código TRD", "Nombre Serie / Subserie", "Nombre de la Unidad Documental", "Fecha Inicial", "Fecha Final", "Caja", "Carpeta", "N° Folios", "Ubicación Física"]
            ];

            db.expedientes.forEach((e, idx) => {
                let trdCode = e.trd.split('|')[0].trim();
                let trdName = e.trd.split('|')[1] || e.trd;
                let fechaIni = e.items.length > 0 ? e.items[0].fdoc : '2026-01-01';
                let fechaFin = e.items.length > 0 ? e.items[e.items.length-1].fdoc : '2026-10-30';
                let nFolios = e.items.length > 0 ? e.items[e.items.length-1].folios : '1';

                wsData.push([
                    idx + 1,
                    trdCode,
                    trdName,
                    `${e.codigo} - ${e.nombre}`,
                    fechaIni,
                    fechaFin,
                    e.ubicacion.caja || 1,
                    e.ubicacion.carpeta || 1,
                    nFolios,
                    e.ubicacion.dep
                ]);
            });

            let ws = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws, "FUID_Consolidado");
            XLSX.writeFile(wb, "FUID_Gobernacion_Valle_Rentas.xlsx");
        }

        // Inicializar render
        renderAll();
    </script>
</body>
</html>
